# terraform_new 인프라(EKS) 연결용 오버라이드.
# 계정/워크스페이스 고유 값은 여기에 하드코딩하지 않고 배포 스크립트가 Terraform output 으로 주입한다:
#   --set global.clusterName=$(terraform output -raw target_cluster_name)
#   --set global.aws.ampRemoteWriteUrl=$(terraform output -raw amp_remote_write_url)
#   --set gateway.serviceAccount.annotations."eks\.amazonaws\.com/role-arn"=$(terraform output -raw target_otel_role_arn)
global:
  environment: "dev"

pipeline:
  logs:
    minSeverityNumber: 9
  traces:
    baselineSamplingPercent: 20

gateway:
  replicaCount: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
