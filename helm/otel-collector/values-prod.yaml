# Production: 비용 최적화 (INFO 이상만, 트레이스 baseline 5% + 에러/지연/결제실패 100%)
global:
  clusterName: "nebula-eks-prod"
  environment: "production"

pipeline:
  logs:
    minSeverityNumber: 9
  traces:
    baselineSamplingPercent: 5
    criticalSamplingPercent: 25

agent:
  resources:
    requests:
      cpu: 200m
      memory: 384Mi
    limits:
      cpu: "1"
      memory: 768Mi

gateway:
  autoscaling:
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 65
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi
