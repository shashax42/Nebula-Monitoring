# Development: 디버깅 편의 우선 (DEBUG 로그 수집, 트레이스 50% 보존), 리소스 최소화
global:
  clusterName: "nebula-eks-dev"
  environment: "dev"

pipeline:
  logs:
    minSeverityNumber: 5        # DEBUG 이상
  traces:
    baselineSamplingPercent: 50
    criticalSamplingPercent: 100

gateway:
  replicaCount: 1
  autoscaling:
    enabled: false
  podDisruptionBudget:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
