# ==========================================================================
# 확장 오버레이: 멀티테넌시 · 결제(PG) 텔레메트리
# --------------------------------------------------------------------------
# 현재 nebula-services 에는 테넌트 개념과 결제(PG) 연동이 없다. 그래서 기본 설정(values.yaml)은
# 실제 서비스가 내보내는 데이터(HTTP/Kafka 스팬, 사가 단계 카운터, 로그)만 처리하고,
# 아래 구성은 해당 기능이 생길 때 켜는 확장으로 분리했다. (docs/adr/0001-core-vs-extension-telemetry.md)
#
#   helm upgrade --install otel-collector helm/otel-collector \
#     -f helm/otel-collector/values-<env>.yaml -f helm/otel-collector/values-extension-business.yaml
#
# 함께 켜야 하는 것: prometheus/rules/extensions/*, grafana/dashboards/extensions/*,
#                   terraform -var enable_business_extensions=true
# Helm 은 map 은 병합하고 list 는 통째로 교체하므로, 바뀌는 리스트(파이프라인·샘플링 정책 등)는 전체를 다시 적는다.
# 앱 계약: docs/TELEMETRY_CONTRACT.md "확장" 절
# ==========================================================================
gateway:
  config:
    connectors:
      # [가공] 테넌트 단위 RED + DB 시간 (Noisy Neighbor / 테넌트 SLO / 비용 배분)
      # 라우트 차원과 분리해 카디널리티를 (service × tenant × status × db.system) 로 제한한다.
      span_metrics/tenant:
        namespace: traces.tenant.metrics
        histogram:
          unit: s
          explicit:
            buckets: [10ms, 50ms, 100ms, 250ms, 500ms, 1s, 2.5s, 5s]
        dimensions:
          - name: tenant.id
          - name: tenant.tier
            default: unknown
          - name: db.system
        exclude_dimensions: [span.name]
        resource_metrics_key_attributes: [service.name, deployment.environment]
        aggregation_cardinality_limit: 10000
        metrics_flush_interval: 15s
        metrics_expiration: 10m

      # [가공] 트레이스 → 비즈니스 논리 오류 (HTTP 200 인데 결제 실패)
      count/business:
        spans:
          nebula.payment.logical_errors:
            description: Payment failed although the HTTP response was 2xx
            conditions:
              - 'attributes["payment.outcome"] == "failure" and attributes["http.response.status_code"] != nil and attributes["http.response.status_code"] < 300'
            attributes:
              - key: service.name
              - key: payment.pg
                default_value: unknown
              - key: tenant.id
                default_value: none

      forward/tenant: {}

      count/logs:
        logs:
          nebula.log.records:
            description: Log records after refinement
            attributes:
              - key: service
                default_value: unknown
              - key: namespace
                default_value: unknown
              - key: level
                default_value: UNSPECIFIED
              - key: tenant_id
                default_value: none

      routing/logs:
        default_pipelines: [logs/app]
        table:
          - context: resource
            condition: attributes["nebula.log.type"] == "k8s-event"
            pipelines: [logs/events]
          - context: log
            condition: attributes["log.type"] == "audit" or attributes["event.domain"] == "payment"
            pipelines: [logs/audit]

    processors:
      # 테넌트 라벨링: span 속성 > 캡처된 x-tenant-id 헤더 > 리소스 속성 순으로 tenant.id 확정
      transform/tenant:
        error_mode: ignore
        trace_statements:
          - context: span
            statements:
              - set(attributes["tenant.id"], attributes["tenant_id"]) where attributes["tenant.id"] == nil and attributes["tenant_id"] != nil
              - set(attributes["tenant.id"], attributes["http.request.header.x-tenant-id"][0]) where attributes["tenant.id"] == nil and attributes["http.request.header.x-tenant-id"] != nil
              - set(attributes["tenant.id"], attributes["http.request.header.x-tenant-id"]) where attributes["tenant.id"] == nil and IsString(attributes["http.request.header.x-tenant-id"])
              - set(attributes["tenant.id"], resource.attributes["tenant.id"]) where attributes["tenant.id"] == nil and resource.attributes["tenant.id"] != nil
              - set(attributes["tenant.tier"], resource.attributes["tenant.tier"]) where attributes["tenant.tier"] == nil and resource.attributes["tenant.tier"] != nil
              - set(attributes["tenant.id"], ToLowerCase(attributes["tenant.id"])) where IsString(attributes["tenant.id"])
              - delete_key(attributes, "tenant_id")

      # 테넌트 메트릭 대상: 테넌트가 식별된 서버/컨슈머 스팬 + DB 클라이언트 스팬만
      filter/tenant-scope:
        error_mode: ignore
        traces:
          span:
            - 'attributes["tenant.id"] == nil'
            - 'kind != SPAN_KIND_SERVER and kind != SPAN_KIND_CONSUMER and attributes["db.system"] == nil'

      # 앱 메트릭의 테넌트 키 통일 (tenant_id / tenantId → tenant.id)
      transform/tenant-metrics:
        error_mode: ignore
        metric_statements:
          - context: datapoint
            statements:
              - set(attributes["tenant.id"], attributes["tenant_id"]) where attributes["tenant.id"] == nil and attributes["tenant_id"] != nil
              - set(attributes["tenant.id"], attributes["tenantId"]) where attributes["tenant.id"] == nil and attributes["tenantId"] != nil
              - delete_matching_keys(attributes, "^(tenant_id|tenantId)$")

      # PG 응답 코드 → 실패 원인 카테고리 (카드 한도 초과 vs PG 타임아웃 등을 구분)
      transform/payment-normalize:
        error_mode: ignore
        metric_statements:
          - context: datapoint
            conditions:
              - metric.name == "nebula.payment.requests"
            statements:
              - set(attributes["payment.failure.category"], "none") where attributes["payment.outcome"] == "success"
              - set(attributes["payment.failure.code"], "") where attributes["payment.failure.code"] == nil
              - set(attributes["payment.failure.category"], "card_limit_exceeded") where attributes["payment.failure.category"] == nil and IsMatch(attributes["payment.failure.code"], "(?i)(LIMIT|EXCEED|한도)")
              - set(attributes["payment.failure.category"], "insufficient_funds") where attributes["payment.failure.category"] == nil and IsMatch(attributes["payment.failure.code"], "(?i)(INSUFFICIENT|NOT_ENOUGH|BALANCE|잔액)")
              - set(attributes["payment.failure.category"], "pg_timeout") where attributes["payment.failure.category"] == nil and IsMatch(attributes["payment.failure.code"], "(?i)(TIMEOUT|TIMED_OUT|^408$|^504$)")
              - set(attributes["payment.failure.category"], "pg_unavailable") where attributes["payment.failure.category"] == nil and IsMatch(attributes["payment.failure.code"], "(?i)(UNAVAILABLE|SYSTEM_ERROR|MAINTENANCE|^50[023]$|점검)")
              - set(attributes["payment.failure.category"], "fraud_suspected") where attributes["payment.failure.category"] == nil and IsMatch(attributes["payment.failure.code"], "(?i)(FRAUD|RISK|SUSPECT|STOLEN|LOST|도난|분실)")
              - set(attributes["payment.failure.category"], "invalid_card") where attributes["payment.failure.category"] == nil and IsMatch(attributes["payment.failure.code"], "(?i)(INVALID_CARD|EXPIRED|CARD_NUMBER|유효기간)")
              - set(attributes["payment.failure.category"], "card_declined") where attributes["payment.failure.category"] == nil and IsMatch(attributes["payment.failure.code"], "(?i)(DECLIN|REJECT|DENIED|NOT_ALLOWED|거절)")
              - set(attributes["payment.failure.category"], "user_cancelled") where attributes["payment.failure.category"] == nil and IsMatch(attributes["payment.failure.code"], "(?i)(CANCEL|ABORT|취소)")
              - set(attributes["payment.failure.category"], "other") where attributes["payment.failure.category"] == nil

      # 결제 실패 트레이스는 항상 보존 (policies 는 list 라 전체를 다시 적는다)
      tail_sampling:
        policies:
          - name: keep-errors
            type: status_code
            status_code:
              status_codes: [ERROR]
          - name: keep-slow
            type: latency
            latency:
              threshold_ms: ${env:TRACE_LATENCY_THRESHOLD_MS}
          - name: keep-payment-failures
            type: string_attribute
            string_attribute:
              key: payment.outcome
              values: [failure]
          - name: critical-services
            type: and
            and:
              and_sub_policy:
                - name: critical-service-match
                  type: string_attribute
                  string_attribute:
                    key: service.name
                    values: ["${env:TRACE_CRITICAL_SERVICES_REGEX}"]
                    enabled_regex_matching: true
                - name: critical-service-rate
                  type: probabilistic
                  probabilistic:
                    sampling_percentage: ${env:TRACE_CRITICAL_SAMPLING_PERCENT}
          - name: baseline
            type: probabilistic
            probabilistic:
              sampling_percentage: ${env:TRACE_BASELINE_SAMPLING_PERCENT}

      filter/cloudwatch-keep:
        error_mode: ignore
        metrics:
          metric:
            - 'not IsMatch(name, "^nebula\\.(sli\\.(requests|errors|slow_requests)|payment\\.requests|payment\\.logical_errors)$")'

      transform/cloudwatch-dims:
        error_mode: ignore
        metric_statements:
          - context: datapoint
            statements:
              - set(attributes["Environment"], "${env:ENVIRONMENT}")
              - set(attributes["Service"], resource.attributes["service.name"]) where resource.attributes["service.name"] != nil
              - set(attributes["Service"], attributes["service.name"]) where attributes["service.name"] != nil
              - set(attributes["PaymentPg"], attributes["payment.pg"]) where attributes["payment.pg"] != nil
              - set(attributes["PaymentMethod"], attributes["payment.method"]) where attributes["payment.method"] != nil
              - set(attributes["FailureCategory"], attributes["payment.failure.category"]) where attributes["payment.failure.category"] != nil
              - set(attributes["Outcome"], attributes["payment.outcome"]) where attributes["payment.outcome"] != nil
          - context: metric
            statements:
              - set(name, "Requests") where name == "nebula.sli.requests"
              - set(name, "Errors") where name == "nebula.sli.errors"
              - set(name, "SlowRequests") where name == "nebula.sli.slow_requests"
              - set(name, "PaymentRequests") where name == "nebula.payment.requests"
              - set(name, "PaymentLogicalErrors") where name == "nebula.payment.logical_errors"

      # 로그의 테넌트 키 통일 → Logs Insights 에서 tenant_id 로 필터
      transform/logs-tenant:
        error_mode: ignore
        log_statements:
          - context: log
            statements:
              - set(attributes["tenant_id"], attributes["tenant.id"]) where attributes["tenant_id"] == nil and attributes["tenant.id"] != nil
              - set(attributes["tenant_id"], attributes["tenantId"]) where attributes["tenant_id"] == nil and attributes["tenantId"] != nil
              - set(attributes["tenant_id"], resource.attributes["tenant.id"]) where attributes["tenant_id"] == nil and resource.attributes["tenant.id"] != nil
              - delete_matching_keys(attributes, "^(tenant\\.id|tenantId)$")

    exporters:
      awsemf:
        metric_declarations:
          - dimensions: [[Environment], [Environment, Service]]
            metric_name_selectors: ["^Requests$", "^Errors$", "^SlowRequests$"]
          - dimensions: [[Environment], [Environment, Outcome], [Environment, FailureCategory], [Environment, PaymentPg, Outcome]]
            metric_name_selectors: ["^PaymentRequests$"]
          - dimensions: [[Environment], [Environment, PaymentPg]]
            metric_name_selectors: ["^PaymentLogicalErrors$"]

      awsxray:
        indexed_attributes: [http.route, messaging.destination.name, deployment.environment, deployment.track, tenant.id, payment.outcome]

    service:
      pipelines:
        traces/in:
          receivers: [otlp]
          processors: [memory_limiter, transform/micrometer-semconv, filter/traces-noise, transform/tenant, transform/traces-redact]
          exporters: [span_metrics, service_graph, count/sli, count/business, forward/tenant, forward/sampling]
        traces/tenant:
          receivers: [forward/tenant]
          processors: [filter/tenant-scope]
          exporters: [span_metrics/tenant]
        metrics:
          receivers: [otlp, prometheus/self]
          processors: [memory_limiter, filter/metrics-drop, transform/metrics-normalize, transform/tenant-metrics, transform/payment-normalize, batch]
          exporters: [prometheus_remote_write/amp]
        metrics/derived:
          receivers: [span_metrics, span_metrics/tenant, service_graph, count/logs, count/business]
          processors: [delta_to_cumulative, transform/derived, batch]
          exporters: [prometheus_remote_write/amp]
        metrics/cloudwatch:
          receivers: [otlp, count/sli, count/business]
          processors: [memory_limiter, filter/cloudwatch-keep, transform/metrics-normalize, transform/payment-normalize, transform/cloudwatch-dims, batch]
          exporters: [awsemf]
        logs/in:
          receivers: [otlp]
          processors: [memory_limiter, transform/logs-flatten, transform/logs-tenant]
          exporters: [count/logs, routing/logs]
