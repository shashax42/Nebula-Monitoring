# FinOps & 역마진(Margin Erosion) 탐지
#   - 인프라 비용 신호: 실행 중 파드의 requests × 단가 (예약한 만큼 비용이 발생한다는 관점)
#   - 테넌트 비용 배분: (공유 풀) 서버 처리시간 점유율 × 클러스터 비용 / (전용 네임스페이스) 네임스페이스 비용
#   - 매출/원가: 앱이 보내는 nebula_order_revenue_total, nebula_order_cost_total{cost_type}
#   - 순마진 게이지 임계: 5% 미만 Warning(Yellow) / 0% 미만 Deficit(Red)
#
# 단가는 "데이터"로 관리한다: 아래 nebula:infra_price_krw:* 상수만 바꾸면 전체 비용 지표가 갱신된다.
#   기본값은 ap-northeast-2 온디맨드 범용 인스턴스 기준 근사치(환율 1,400원)이며, 실제 계약 단가로 교체할 것.
groups:
  - name: nebula.finops.prices
    interval: 5m
    rules:
      - record: nebula:infra_price_krw:cpu_core_hour
        expr: vector(56)
      - record: nebula:infra_price_krw:memory_gib_hour
        expr: vector(7)

  - name: nebula.finops.cost
    interval: 5m
    rules:
      # 네임스페이스 시간당 인프라 비용 (₩/h)
      - record: namespace:infra_cost_krw:rate1h
        expr: |
          namespace:cpu_requests:sum * on () group_left () nebula:infra_price_krw:cpu_core_hour
          + on (cluster, namespace)
          (namespace:memory_requests_bytes:sum / 2^30) * on () group_left () nebula:infra_price_krw:memory_gib_hour
      - record: cluster:infra_cost_krw:rate1h
        expr: sum by (cluster) (namespace:infra_cost_krw:rate1h)

      # 테넌트 비용 배분 — 공유 풀 모델
      - record: tenant:infra_cost_krw:rate1h
        expr: |
          tenant:server_time_share:ratio1h
          * on (cluster) group_left ()
          cluster:infra_cost_krw:rate1h
      # 테넌트 비용 배분 — 네임스페이스 전용 모델 (namespace 라벨 tenant-id)
      - record: tenant_namespace:infra_cost_krw:rate1h
        expr: |
          sum by (cluster, label_tenant_id) (
            namespace:infra_cost_krw:rate1h
            * on (cluster, namespace) group_left (label_tenant_id)
            max by (cluster, namespace, label_tenant_id) (kube_namespace_labels{label_tenant_id!=""})
          )

      # 리소스 효율: 요청(requests) 대비 실제 사용률 → 낭비 비용
      - record: namespace:idle_cost_krw:rate1h
        expr: |
          namespace:infra_cost_krw:rate1h
          * on (cluster, namespace)
          clamp_min(1 - namespace:cpu_usage_vs_request:ratio, 0)

  - name: nebula.finops.margin
    interval: 5m
    rules:
      - record: nebula:revenue_krw:increase1h
        expr: sum by (cluster) (increase(nebula_order_revenue_total[1h]))
      - record: nebula:order_cost_krw:increase1h
        expr: sum by (cluster, cost_type) (increase(nebula_order_cost_total[1h]))
      # Total OpEx = 주문 변동비(원가·PG수수료·배송비·쿠폰) + 인프라 비용
      - record: nebula:opex_krw:increase1h
        expr: |
          sum by (cluster) (nebula:order_cost_krw:increase1h)
          + on (cluster)
          cluster:infra_cost_krw:rate1h
      - record: nebula:margin_krw:increase1h
        expr: nebula:revenue_krw:increase1h - on (cluster) nebula:opex_krw:increase1h
      - record: nebula:net_margin:ratio1h
        expr: nebula:margin_krw:increase1h / on (cluster) (nebula:revenue_krw:increase1h > 0)
      # Burn Rate (₩/h): 적자일 때 시간당 손실액
      - record: nebula:margin_burn_krw:rate1h
        expr: clamp_min(-nebula:margin_krw:increase1h, 0)
      # 손익분기점(BEP) 대비 매출 비율 (1 미만이면 BEP 미달)
      - record: nebula:bep_coverage:ratio1h
        expr: nebula:revenue_krw:increase1h / on (cluster) nebula:opex_krw:increase1h

      # 테넌트 단위 비용 효율 (매출 / 배분된 인프라 비용) — SLA/티어 가격 정책 검증용
      - record: tenant:revenue_krw:increase1h
        expr: sum by (cluster, tenant_id) (increase(nebula_order_revenue_total[1h]))
      - record: tenant:cost_efficiency:ratio1h
        expr: |
          tenant:revenue_krw:increase1h
          / on (cluster, tenant_id)
          sum by (cluster, tenant_id) (tenant:infra_cost_krw:rate1h)

  - name: nebula.finops.alerts
    rules:
      - alert: NetMarginLow
        expr: nebula:net_margin:ratio1h < 0.05 and nebula:net_margin:ratio1h >= 0
        for: 30m
        labels:
          severity: warning
          team: finance
        annotations:
          summary: "순마진 {{ $value | humanizePercentage }} (5% 미만)"
          runbook_url: https://github.com/shashax42/Nebula-Monitoring/blob/main/docs/RUNBOOK.md#netmargindeficit

      - alert: NetMarginDeficit
        expr: nebula:net_margin:ratio1h < 0
        for: 15m
        labels:
          severity: critical
          team: finance
        annotations:
          summary: "역마진 진입: 순마진 {{ $value | humanizePercentage }}"
          description: "쿠폰 중복 적용/배송비/PG 수수료 구성 확인. 프로모션 서킷 브레이커(쿠폰 발급 제한) 발동 검토."
          runbook_url: https://github.com/shashax42/Nebula-Monitoring/blob/main/docs/RUNBOOK.md#netmargindeficit

      # D+? Deficit Entry: 최근 6시간 추세가 이어지면 6시간 안에 적자 전환
      - alert: MarginDeficitPredicted
        expr: |
          predict_linear(nebula:net_margin:ratio1h[6h], 6 * 3600) < 0
          and nebula:net_margin:ratio1h > 0
        for: 30m
        labels:
          severity: warning
          team: finance
        annotations:
          summary: "6시간 내 역마진 전환 예측 (현재 {{ $value | humanizePercentage }} 추세)"
          runbook_url: https://github.com/shashax42/Nebula-Monitoring/blob/main/docs/RUNBOOK.md#netmargindeficit
