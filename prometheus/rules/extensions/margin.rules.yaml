# 확장: 매출 대비 마진 / 역마진(Margin Erosion) 탐지
#   현재 nebula-services 는 매출·원가 이벤트를 내보내지 않는다. 주문 금액·원가 계약
#   (nebula_order_revenue_total, nebula_order_cost_total{cost_type})을 구현한 뒤 켠다.
#   순마진 임계: 5% 미만 Warning / 0% 미만 Deficit. 인프라 비용은 05-cost.rules.yaml 에서 온다.
#   테넌트 효율(tenant:cost_efficiency)은 extensions/tenant.rules.yaml 과 함께 로드해야 값이 나온다.
groups:
  - name: nebula.finops.margin
    interval: 5m
    rules:
      - record: nebula:revenue_krw:increase1h
        expr: sum by (cluster) (increase(nebula_order_revenue_total[1h]))
      - record: nebula:order_cost_krw:increase1h
        expr: sum by (cluster, cost_type) (increase(nebula_order_cost_total[1h]))
      # Total OpEx = 주문 변동비(원가·PG수수료·배송비·쿠폰) + 인프라 비용
      #   인프라 비용 신호(kube-state-metrics)가 없을 때도 주문 변동비만으로 마진을 계산하도록 0 으로 대체
      - record: nebula:opex_krw:increase1h
        expr: |
          sum by (cluster) (nebula:order_cost_krw:increase1h)
          + on (cluster)
          (
            cluster:infra_cost_krw:rate1h
            or on (cluster) sum by (cluster) (nebula:order_cost_krw:increase1h) * 0
          )
      - record: nebula:margin_krw:increase1h
        expr: nebula:revenue_krw:increase1h - on (cluster) nebula:opex_krw:increase1h
      - record: nebula:net_margin:ratio1h
        expr: nebula:margin_krw:increase1h / on (cluster) (nebula:revenue_krw:increase1h > 0)
      # Burn Rate (₩/h): 적자일 때 시간당 손실액
      - record: nebula:margin_burn_krw:rate1h
        expr: clamp_min(-nebula:margin_krw:increase1h, 0)
      # 손익분기점(BEP) 대비 매출 비율 (1 미만이면 BEP 미달)
      - record: nebula:bep_coverage:ratio1h
        expr: nebula:revenue_krw:increase1h / on (cluster) nebula:opex_krw:increase1h

      # 테넌트 단위 비용 효율 (매출 / 배분된 인프라 비용) — SLA/티어 가격 정책 검증용
      - record: tenant:revenue_krw:increase1h
        expr: sum by (cluster, tenant_id) (increase(nebula_order_revenue_total[1h]))
      - record: tenant:cost_efficiency:ratio1h
        expr: |
          tenant:revenue_krw:increase1h
          / on (cluster, tenant_id)
          sum by (cluster, tenant_id) (tenant:infra_cost_krw:rate1h)

  - name: nebula.finops.alerts
    rules:
      - alert: NetMarginLow
        expr: nebula:net_margin:ratio1h < 0.05 and nebula:net_margin:ratio1h >= 0
        for: 30m
        labels:
          severity: warning
          team: finance
        annotations:
          summary: "순마진 {{ $value | humanizePercentage }} (5% 미만)"
          runbook_url: https://github.com/shashax42/Nebula-Monitoring/blob/main/docs/RUNBOOK.md#netmargindeficit

      - alert: NetMarginDeficit
        expr: nebula:net_margin:ratio1h < 0
        for: 15m
        labels:
          severity: critical
          team: finance
        annotations:
          summary: "역마진 진입: 순마진 {{ $value | humanizePercentage }}"
          description: "쿠폰 중복 적용/배송비/PG 수수료 구성 확인. 프로모션 서킷 브레이커(쿠폰 발급 제한) 발동 검토."
          runbook_url: https://github.com/shashax42/Nebula-Monitoring/blob/main/docs/RUNBOOK.md#netmargindeficit

      # D+? Deficit Entry: 최근 6시간 추세가 이어지면 6시간 안에 적자 전환
      - alert: MarginDeficitPredicted
        expr: |
          predict_linear(nebula:net_margin:ratio1h[6h], 6 * 3600) < 0
          and nebula:net_margin:ratio1h > 0
        for: 30m
        labels:
          severity: warning
          team: finance
        annotations:
          summary: "6시간 내 역마진 전환 예측 (현재 {{ $value | humanizePercentage }} 추세)"
          runbook_url: https://github.com/shashax42/Nebula-Monitoring/blob/main/docs/RUNBOOK.md#netmargindeficit
