# Kubernetes 인프라: Saturation(포화도) 가공 + 클러스터 건강 알림
# 입력: kubelet /metrics/resource(node_*), cAdvisor(container_*), kube-state-metrics(kube_*), kubelet(kubelet_volume_*)
groups:
  - name: nebula.kubernetes.recording
    interval: 30s
    rules:
      # ---------- 노드 ----------
      - record: node:cpu_utilization:ratio
        expr: |
          sum by (cluster, node) (rate(node_cpu_usage_seconds_total[5m]))
          /
          sum by (cluster, node) (kube_node_status_capacity{resource="cpu"})
      - record: node:memory_utilization:ratio
        expr: |
          sum by (cluster, node) (node_memory_working_set_bytes)
          /
          sum by (cluster, node) (kube_node_status_capacity{resource="memory"})
      - record: cluster:cpu_utilization:ratio
        expr: |
          sum by (cluster) (rate(node_cpu_usage_seconds_total[5m]))
          /
          sum by (cluster) (kube_node_status_capacity{resource="cpu"})
      - record: cluster:memory_utilization:ratio
        expr: |
          sum by (cluster) (node_memory_working_set_bytes)
          /
          sum by (cluster) (kube_node_status_capacity{resource="memory"})

      # ---------- 실행 중인 파드의 requests/limits ----------
      - record: namespace:cpu_requests:sum
        expr: |
          sum by (cluster, namespace) (
            kube_pod_container_resource_requests{resource="cpu"}
            * on (cluster, namespace, pod) group_left () (kube_pod_status_phase{phase="Running"} == 1)
          )
      - record: namespace:memory_requests_bytes:sum
        expr: |
          sum by (cluster, namespace) (
            kube_pod_container_resource_requests{resource="memory"}
            * on (cluster, namespace, pod) group_left () (kube_pod_status_phase{phase="Running"} == 1)
          )
      - record: namespace:cpu_limits:sum
        expr: |
          sum by (cluster, namespace) (
            kube_pod_container_resource_limits{resource="cpu"}
            * on (cluster, namespace, pod) group_left () (kube_pod_status_phase{phase="Running"} == 1)
          )
      - record: namespace:memory_limits_bytes:sum
        expr: |
          sum by (cluster, namespace) (
            kube_pod_container_resource_limits{resource="memory"}
            * on (cluster, namespace, pod) group_left () (kube_pod_status_phase{phase="Running"} == 1)
          )

      # ---------- 사용량 ----------
      - record: namespace:container_cpu_usage:rate5m
        expr: sum by (cluster, namespace) (rate(container_cpu_usage_seconds_total{container!=""}[5m]))
      - record: namespace:container_memory_working_set_bytes:sum
        expr: sum by (cluster, namespace) (container_memory_working_set_bytes{container!=""})
      - record: pod:container_cpu_usage:rate5m
        expr: sum by (cluster, namespace, pod) (rate(container_cpu_usage_seconds_total{container!=""}[5m]))
      - record: pod:container_memory_working_set_bytes:sum
        expr: sum by (cluster, namespace, pod) (container_memory_working_set_bytes{container!=""})

      # ---------- 사용률 (Q4 대시보드, 다운사이징/스케일업 후보) ----------
      - record: namespace:cpu_usage_vs_limit:ratio
        expr: namespace:container_cpu_usage:rate5m / namespace:cpu_limits:sum
      - record: namespace:memory_usage_vs_limit:ratio
        expr: namespace:container_memory_working_set_bytes:sum / namespace:memory_limits_bytes:sum
      - record: namespace:cpu_usage_vs_request:ratio
        expr: namespace:container_cpu_usage:rate5m / namespace:cpu_requests:sum
      - record: namespace:memory_usage_vs_request:ratio
        expr: namespace:container_memory_working_set_bytes:sum / namespace:memory_requests_bytes:sum
      - record: pod:cpu_usage_vs_limit:ratio
        expr: |
          pod:container_cpu_usage:rate5m
          / sum by (cluster, namespace, pod) (kube_pod_container_resource_limits{resource="cpu"})
      - record: pod:cpu_usage_vs_request:ratio
        expr: |
          pod:container_cpu_usage:rate5m
          / sum by (cluster, namespace, pod) (kube_pod_container_resource_requests{resource="cpu"})
      - record: pod:memory_usage_vs_limit:ratio
        expr: |
          pod:container_memory_working_set_bytes:sum
          / sum by (cluster, namespace, pod) (kube_pod_container_resource_limits{resource="memory"})

  - name: nebula.kubernetes.alerts
    rules:
      - alert: KubeNodeNotReady
        expr: kube_node_status_condition{condition="Ready", status="true"} == 0
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "노드 {{ $labels.node }} NotReady ({{ $labels.cluster }})"
          description: "5분 이상 Ready=false. 해당 노드의 파드가 재스케줄링되지 않으면 용량 부족으로 이어진다."
          runbook_url: https://github.com/shashax42/Nebula-Monitoring/blob/main/docs/RUNBOOK.md#kubenodenotready

      - alert: KubeNodePressure
        expr: kube_node_status_condition{condition=~"MemoryPressure|DiskPressure|PIDPressure", status="true"} == 1
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "노드 {{ $labels.node }} {{ $labels.condition }}"
          description: "kubelet 이 축출(eviction)을 시작할 수 있는 상태."
          runbook_url: https://github.com/shashax42/Nebula-Monitoring/blob/main/docs/RUNBOOK.md#kubenodepressure

      - alert: NodeCPUHigh
        expr: node:cpu_utilization:ratio > 0.8
        for: 15m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "노드 {{ $labels.node }} CPU {{ $value | humanizePercentage }}"
          runbook_url: https://github.com/shashax42/Nebula-Monitoring/blob/main/docs/RUNBOOK.md#nodecpuhigh

      - alert: NodeMemoryHigh
        expr: node:memory_utilization:ratio > 0.85
        for: 15m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "노드 {{ $labels.node }} 메모리 {{ $value | humanizePercentage }}"
          runbook_url: https://github.com/shashax42/Nebula-Monitoring/blob/main/docs/RUNBOOK.md#nodememoryhigh

      - alert: KubePodCrashLooping
        expr: max_over_time(kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"}[5m]) >= 1
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }}) CrashLoopBackOff"
          runbook_url: https://github.com/shashax42/Nebula-Monitoring/blob/main/docs/RUNBOOK.md#kubepodcrashlooping

      - alert: KubePodRestartsHigh
        expr: increase(kube_pod_container_status_restarts_total[15m]) > 3
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.pod }} 15분간 {{ $value | humanize }}회 재시작"
          runbook_url: https://github.com/shashax42/Nebula-Monitoring/blob/main/docs/RUNBOOK.md#kubepodcrashlooping

      - alert: KubeContainerOOMKilled
        expr: |
          (increase(kube_pod_container_status_restarts_total[10m]) >= 1)
          and on (cluster, namespace, pod, container)
          (max_over_time(kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}[10m]) == 1)
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }}) OOMKilled"
          description: "메모리 limit 상향 또는 누수 점검 필요."
          runbook_url: https://github.com/shashax42/Nebula-Monitoring/blob/main/docs/RUNBOOK.md#kubecontaineroomkilled

      - alert: KubePodNotHealthy
        expr: sum by (cluster, namespace, pod) (kube_pod_status_phase{phase=~"Pending|Unknown|Failed"}) > 0
        for: 15m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.pod }} 15분 이상 비정상 phase"
          runbook_url: https://github.com/shashax42/Nebula-Monitoring/blob/main/docs/RUNBOOK.md#kubepodnothealthy

      - alert: KubeDeploymentReplicasMismatch
        expr: kube_deployment_spec_replicas > kube_deployment_status_replicas_available
        for: 15m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.deployment }} 가용 replica 부족"
          runbook_url: https://github.com/shashax42/Nebula-Monitoring/blob/main/docs/RUNBOOK.md#kubedeploymentreplicasmismatch

      - alert: KubeJobFailed
        expr: kube_job_status_failed > 0
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Job {{ $labels.namespace }}/{{ $labels.job_name }} 실패"
          runbook_url: https://github.com/shashax42/Nebula-Monitoring/blob/main/docs/RUNBOOK.md#kubejobfailed

      - alert: KubePersistentVolumeFillingUp
        expr: |
          kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes < 0.10
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} 여유 {{ $value | humanizePercentage }}"
          runbook_url: https://github.com/shashax42/Nebula-Monitoring/blob/main/docs/RUNBOOK.md#kubepersistentvolumefillingup

      - alert: ContainerMemoryNearLimit
        expr: |
          sum by (cluster, namespace, pod, container) (container_memory_working_set_bytes{container!=""})
          /
          sum by (cluster, namespace, pod, container) (kube_pod_container_resource_limits{resource="memory"})
          > 0.9
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.pod }} 메모리가 limit 의 {{ $value | humanizePercentage }}"
          runbook_url: https://github.com/shashax42/Nebula-Monitoring/blob/main/docs/RUNBOOK.md#kubecontaineroomkilled

      - alert: ContainerCPUThrottlingHigh
        expr: |
          sum by (cluster, namespace, pod, container) (rate(container_cpu_cfs_throttled_periods_total[5m]))
          /
          sum by (cluster, namespace, pod, container) (rate(container_cpu_cfs_periods_total[5m]))
          > 0.25
        for: 15m
        labels:
          severity: info
          team: platform
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.pod }} CPU 스로틀링 {{ $value | humanizePercentage }}"
          description: "지연(P99) 악화의 숨은 원인. CPU limit 상향 또는 제거 검토."
          runbook_url: https://github.com/shashax42/Nebula-Monitoring/blob/main/docs/RUNBOOK.md#containercputhrottlinghigh
