# 비즈니스 완결성: 주문 사가 (Transactional Event Flow, nebula-services 실제 흐름)
#
#   service-order                     Kafka "purchase"            service-product
#   order_placed ─▶ purchase_published ──────────────▶ purchase_consumed ─┬─▶ 재고 차감 (완료)
#        │          purchase_publish_failed                               └─▶ stock_rejected
#        │                                                                        │ Kafka "refund"
#        └──────────────────────────── order_canceled ◀───────────────────────────┘ (보상 트랜잭션)
#
# 입력 (앱 OTLP 계약: docs/TELEMETRY_CONTRACT.md)
#   nebula_commerce_funnel_events_total{funnel_stage, reason}   reason: none | out_of_stock | publish_error | other
#     - order_placed 는 주문 트랜잭션 커밋 후(AFTER_COMMIT), purchase_published/failed 는 Kafka send 결과 기준
#     - purchase_consumed 는 재고 처리 성공·거절 모두 포함 (거절은 그 부분집합)
#   traces_span_metrics_*{span_kind="SPAN_KIND_PRODUCER|SPAN_KIND_CONSUMER", messaging_destination_name}  (Kafka 스팬)
#   kafka_consumer_group_lag{group, topic, partition}  (cluster collector kafka_metrics)
#
# HTTP 지표로는 안 보이는 장애를 잡는다: API 는 200 인데 이벤트 발행이 실패하거나, 재고 거절 후 주문 취소(보상)가 누락되는 경우.
groups:
  - name: nebula.business.saga
    interval: 1m
    rules:
      - record: saga:events:rate5m
        expr: sum by (cluster, environment, funnel_stage, reason) (rate(nebula_commerce_funnel_events_total[5m]))
      - record: saga:events:increase1h
        expr: sum by (cluster, environment, funnel_stage) (increase(nebula_commerce_funnel_events_total[1h]))

      # Kafka 발행 실패율 (주문은 커밋됐는데 재고 서비스로 이벤트가 가지 않음)
      - record: saga:publish_failure:ratio_rate5m
        expr: |
          (
            sum by (cluster, environment) (rate(nebula_commerce_funnel_events_total{funnel_stage="purchase_publish_failed"}[5m]))
            or sum by (cluster, environment) (rate(nebula_commerce_funnel_events_total{funnel_stage="purchase_published"}[5m])) * 0
          )
          / sum by (cluster, environment) (rate(nebula_commerce_funnel_events_total{funnel_stage=~"purchase_published|purchase_publish_failed"}[5m]))

      # 재고 거절률: 소비된 구매 이벤트 중 재고 부족으로 거절된 비율
      - record: saga:stock_rejection:ratio_rate15m
        expr: |
          (
            sum by (cluster, environment) (rate(nebula_commerce_funnel_events_total{funnel_stage="stock_rejected"}[15m]))
            or sum by (cluster, environment) (rate(nebula_commerce_funnel_events_total{funnel_stage="purchase_consumed"}[15m])) * 0
          )
          / sum by (cluster, environment) (rate(nebula_commerce_funnel_events_total{funnel_stage="purchase_consumed"}[15m]))

      # 사가 완료율 (1h): 재고 차감까지 끝난 주문 / 접수된 주문
      - record: saga:completion:ratio1h
        expr: |
          (
            sum by (cluster, environment) (saga:events:increase1h{funnel_stage="purchase_consumed"})
            - (
              sum by (cluster, environment) (saga:events:increase1h{funnel_stage="stock_rejected"})
              or sum by (cluster, environment) (saga:events:increase1h{funnel_stage="purchase_consumed"}) * 0
            )
          )
          / sum by (cluster, environment) (saga:events:increase1h{funnel_stage="order_placed"})

      # 단계 사이에 멈춘 건수 (15분 창). 창 경계의 처리 중 이벤트 때문에 작은 값은 정상
      - record: saga:consume_gap:increase15m
        expr: |
          clamp_min(
            sum by (cluster, environment) (increase(nebula_commerce_funnel_events_total{funnel_stage="purchase_published"}[15m]))
            - (
              sum by (cluster, environment) (increase(nebula_commerce_funnel_events_total{funnel_stage="purchase_consumed"}[15m]))
              or sum by (cluster, environment) (increase(nebula_commerce_funnel_events_total{funnel_stage="purchase_published"}[15m])) * 0
            ),
            0
          )
      - record: saga:compensation_gap:increase15m
        expr: |
          clamp_min(
            sum by (cluster, environment) (increase(nebula_commerce_funnel_events_total{funnel_stage="stock_rejected"}[15m]))
            - (
              sum by (cluster, environment) (increase(nebula_commerce_funnel_events_total{funnel_stage="order_canceled"}[15m]))
              or sum by (cluster, environment) (increase(nebula_commerce_funnel_events_total{funnel_stage="stock_rejected"}[15m])) * 0
            ),
            0
          )

      # 토픽별 Kafka 스팬 지연 (consumer = 메시지 처리 시간, producer = 브로커 ack 까지)
      - record: saga_topic:consumer_latency_seconds:p95_5m
        expr: |
          histogram_quantile(0.95, sum by (cluster, environment, service_name, messaging_destination_name, le) (
            rate(traces_span_metrics_duration_seconds_bucket{span_kind="SPAN_KIND_CONSUMER", messaging_destination_name!=""}[5m])
          ))
      - record: saga_topic:producer_latency_seconds:p95_5m
        expr: |
          histogram_quantile(0.95, sum by (cluster, environment, service_name, messaging_destination_name, le) (
            rate(traces_span_metrics_duration_seconds_bucket{span_kind="SPAN_KIND_PRODUCER", messaging_destination_name!=""}[5m])
          ))
      - record: saga_topic:consumer_errors:rate5m
        expr: |
          sum by (cluster, environment, service_name, messaging_destination_name) (
            rate(traces_span_metrics_calls_total{span_kind="SPAN_KIND_CONSUMER", status_code="STATUS_CODE_ERROR", messaging_destination_name!=""}[5m])
          )

  - name: nebula.business.messaging
    interval: 30s
    rules:
      - record: messaging:kafka_consumer_lag:sum
        expr: sum by (cluster, group, topic) (kafka_consumer_group_lag)
      - record: messaging:rabbitmq_backlog:sum
        expr: sum by (cluster, vhost, queue) (rabbitmq_message_current{state="ready"})

  - name: nebula.business.alerts
    rules:
      # 주문은 저장됐는데 재고 서비스로 이벤트가 가지 않음 → 재고 미차감 주문 누적
      - alert: SagaPublishFailures
        expr: |
          saga:publish_failure:ratio_rate5m > 0.01
          and on (cluster, environment)
          sum by (cluster, environment) (increase(nebula_commerce_funnel_events_total{funnel_stage="purchase_publish_failed"}[5m])) >= 3
        for: 5m
        labels:
          severity: critical
          team: service-owner
        annotations:
          summary: "주문 이벤트(purchase) 발행 실패율 {{ $value | humanizePercentage }}"
          description: "service-order → Kafka 전송 실패. 브로커 상태(Strimzi market-message), 프로듀서 에러 로그('주문 이벤트 전송 실패'), 실패 주문 재발행 필요 여부 확인."
          runbook_url: https://github.com/shashax42/Nebula-Monitoring/blob/main/docs/RUNBOOK.md#sagapublishfailures

      # 발행은 되는데 재고 서비스가 하나도 처리하지 못함 (컨슈머 다운/역직렬화 실패/리밸런싱 루프)
      - alert: SagaStalled
        expr: |
          sum by (cluster, environment) (rate(nebula_commerce_funnel_events_total{funnel_stage="purchase_published"}[10m])) > 0
          unless on (cluster, environment)
          sum by (cluster, environment) (rate(nebula_commerce_funnel_events_total{funnel_stage="purchase_consumed"}[10m])) > 0
        for: 10m
        labels:
          severity: critical
          team: service-owner
        annotations:
          summary: "주문 사가 정지: purchase 이벤트가 발행되지만 service-product 처리 0건"
          description: "purchase 토픽 lag(messaging:kafka_consumer_lag:sum), service-product 파드/컨슈머 에러 스팬(saga_topic:consumer_errors:rate5m) 확인."
          runbook_url: https://github.com/shashax42/Nebula-Monitoring/blob/main/docs/RUNBOOK.md#sagastalled

      # 재고 거절 후 주문 취소(보상)가 따라오지 않음 → 재고 없는 주문이 '접수' 상태로 남는다
      - alert: SagaCompensationGap
        expr: |
          saga:compensation_gap:increase15m > 3
          and on (cluster, environment)
          saga:compensation_gap:increase15m
            > 0.2 * sum by (cluster, environment) (increase(nebula_commerce_funnel_events_total{funnel_stage="stock_rejected"}[15m]))
        for: 15m
        labels:
          severity: critical
          team: service-owner
        annotations:
          summary: "보상 트랜잭션 누락: 15분간 재고 거절 대비 미취소 {{ $value | humanize }}건"
          description: "refund 토픽 발행(service-product)/소비(service-order) 확인. 미취소 주문은 데이터 정합성 보정 대상."
          runbook_url: https://github.com/shashax42/Nebula-Monitoring/blob/main/docs/RUNBOOK.md#sagacompensationgap

      # 재고 거절 급증: 시스템 장애가 아니라 재고 소진/프로모션 과열 신호 (평소 대비 2배 + 절대치 5%)
      - alert: StockRejectionSpike
        expr: |
          saga:stock_rejection:ratio_rate15m > 0.05
          and saga:stock_rejection:ratio_rate15m > 2 * avg_over_time(saga:stock_rejection:ratio_rate15m[1d])
          and on (cluster, environment)
          sum by (cluster, environment) (increase(nebula_commerce_funnel_events_total{funnel_stage="purchase_consumed"}[15m])) > 50
        for: 15m
        labels:
          severity: warning
          team: commerce
        annotations:
          summary: "재고 부족 거절률 {{ $value | humanizePercentage }} (평소 대비 2배↑)"
          description: "품절 상품 노출/프로모션 재고 설정 확인. 시스템 오류가 아니므로 SLO 알림과 별도로 다룬다."
          runbook_url: https://github.com/shashax42/Nebula-Monitoring/blob/main/docs/RUNBOOK.md#stockrejectionspike

      - alert: AsyncBacklogGrowing
        expr: |
          (messaging:kafka_consumer_lag:sum > 1000 and deriv(messaging:kafka_consumer_lag:sum[15m]) > 0)
          or
          (messaging:rabbitmq_backlog:sum > 1000 and deriv(messaging:rabbitmq_backlog:sum[15m]) > 0)
        for: 15m
        labels:
          severity: warning
          team: service-owner
        annotations:
          summary: "비동기 처리 적체 증가: {{ $labels.group }}{{ $labels.queue }} {{ $labels.topic }} ({{ $value | humanize }})"
          runbook_url: https://github.com/shashax42/Nebula-Monitoring/blob/main/docs/RUNBOOK.md#asyncbackloggrowing

      # API 는 정상인데 후행 비즈니스 로직이 밀리는 상황 (HTTP 지표만으로는 보이지 않는 장애)
      - alert: AsyncLagWhileAPIHealthy
        expr: |
          (messaging:kafka_consumer_lag:sum > 5000 and deriv(messaging:kafka_consumer_lag:sum[30m]) > 0)
          unless on (cluster)
          (sum by (cluster) (service:errors:rate5m) / sum by (cluster) (service:requests:rate5m) > 0.01)
        for: 30m
        labels:
          severity: critical
          team: service-owner
        annotations:
          summary: "API 정상, Consumer {{ $labels.group }}/{{ $labels.topic }} lag {{ $value | humanize }} 지속 증가"
          description: "주문 후처리(재고 차감·보상 취소) 지연. 컨슈머 스케일아웃/에러 스팬 확인."
          runbook_url: https://github.com/shashax42/Nebula-Monitoring/blob/main/docs/RUNBOOK.md#asyncbackloggrowing
