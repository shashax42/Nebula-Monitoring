# promtool test rules rules.test.yaml   (기본 배포 규칙)
# 규칙이 "의도한 값"을 만들고 "의도한 순간"에 알림이 발화하는지 검증한다.
# 확장 규칙(extensions/)은 extensions.test.yaml
rule_files:
  - ../rules/01-kubernetes.rules.yaml
  - ../rules/02-service-slo.rules.yaml
  - ../rules/04-business.rules.yaml
  - ../rules/05-cost.rules.yaml
  - ../rules/06-anomaly.rules.yaml
  - ../rules/07-pipeline.rules.yaml
  - ../rules/08-batch.rules.yaml

evaluation_interval: 1m

tests:
  # ------------------------------------------------------------------
  # 서비스 SLO: 에러 9.1% → 14.4x(1h/5m), 6x(6h/30m) 번레이트 알림
  # ------------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'traces_span_metrics_calls_total{cluster="c1",environment="dev",service_name="checkout",span_kind="SPAN_KIND_SERVER",status_code="STATUS_CODE_OK"}'
        values: '0+600x120'
      - series: 'traces_span_metrics_calls_total{cluster="c1",environment="dev",service_name="checkout",span_kind="SPAN_KIND_SERVER",status_code="STATUS_CODE_ERROR"}'
        values: '0+60x120'
      # 클라이언트 스팬은 SLI 에서 제외되어야 한다
      - series: 'traces_span_metrics_calls_total{cluster="c1",environment="dev",service_name="checkout",span_kind="SPAN_KIND_CLIENT",status_code="STATUS_CODE_ERROR"}'
        values: '0+6000x120'
      # 에러가 없는 서비스
      - series: 'traces_span_metrics_calls_total{cluster="c1",environment="dev",service_name="cart",span_kind="SPAN_KIND_SERVER",status_code="STATUS_CODE_OK"}'
        values: '0+600x120'
    promql_expr_test:
      - expr: round(service:error_ratio:rate5m, 0.001)
        eval_time: 30m
        exp_samples:
          - labels: '{cluster="c1",environment="dev",service_name="cart"}'
            value: 0
          - labels: '{cluster="c1",environment="dev",service_name="checkout"}'
            value: 0.091
      - expr: count by (service_name, window) (ALERTS{alertname="SLOAvailabilityBurnFast", alertstate="firing"})
        eval_time: 30m
        exp_samples:
          - labels: '{service_name="checkout",window="1h"}'
            value: 1
          - labels: '{service_name="checkout",window="6h"}'
            value: 1
      # 1d/2h 티켓 알림은 for: 1h 이므로 30분 시점엔 아직 pending
      - expr: count(ALERTS{alertname="SLOAvailabilityBurnSlow", alertstate="firing"}) or vector(0)
        eval_time: 30m
        exp_samples:
          - labels: '{}'
            value: 0

  # ------------------------------------------------------------------
  # 지연 SLO: 1s 초과 요청 비율 50% → 6x(0.3) 번레이트 알림, 14.4x(0.72)는 미발화
  # ------------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'traces_span_metrics_calls_total{cluster="c1",environment="dev",service_name="search",span_kind="SPAN_KIND_SERVER",status_code="STATUS_CODE_OK"}'
        values: '0+100x90'
      - series: 'traces_span_metrics_duration_seconds_bucket{cluster="c1",environment="dev",service_name="search",span_kind="SPAN_KIND_SERVER",le="1"}'
        values: '0+50x90'
      - series: 'traces_span_metrics_duration_seconds_bucket{cluster="c1",environment="dev",service_name="search",span_kind="SPAN_KIND_SERVER",le="+Inf"}'
        values: '0+100x90'
      - series: 'traces_span_metrics_duration_seconds_count{cluster="c1",environment="dev",service_name="search",span_kind="SPAN_KIND_SERVER"}'
        values: '0+100x90'
    promql_expr_test:
      - expr: round(service:sli_latency_bad:ratio_rate1h, 0.01)
        eval_time: 70m
        exp_samples:
          - labels: '{cluster="c1",environment="dev",service_name="search"}'
            value: 0.5
      - expr: count by (window) (ALERTS{alertname="SLOLatencyBurnFast", alertstate="firing"})
        eval_time: 70m
        exp_samples:
          - labels: '{window="6h"}'
            value: 1

  # ------------------------------------------------------------------
  # 주문 사가: 발행 실패 3% + 재고 거절 10건/분 중 취소 4건/분 → 발행 실패·보상 누락 알림
  #   완료율 = (소비 97 - 거절 10) / 접수 100 = 0.87, 재고 거절률 = 10 / 97
  # ------------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'nebula_commerce_funnel_events_total{cluster="c1",environment="dev",job="service-order",funnel_stage="order_placed",reason="none"}'
        values: '0+100x90'
      - series: 'nebula_commerce_funnel_events_total{cluster="c1",environment="dev",job="service-order",funnel_stage="purchase_published",reason="none"}'
        values: '0+97x90'
      - series: 'nebula_commerce_funnel_events_total{cluster="c1",environment="dev",job="service-order",funnel_stage="purchase_publish_failed",reason="publish_error"}'
        values: '0+3x90'
      - series: 'nebula_commerce_funnel_events_total{cluster="c1",environment="dev",job="service-product",funnel_stage="purchase_consumed",reason="none"}'
        values: '0+97x90'
      - series: 'nebula_commerce_funnel_events_total{cluster="c1",environment="dev",job="service-product",funnel_stage="stock_rejected",reason="out_of_stock"}'
        values: '0+10x90'
      - series: 'nebula_commerce_funnel_events_total{cluster="c1",environment="dev",job="service-order",funnel_stage="order_canceled",reason="out_of_stock"}'
        values: '0+4x90'
    promql_expr_test:
      - expr: round(saga:publish_failure:ratio_rate5m, 0.001)
        eval_time: 30m
        exp_samples:
          - labels: '{cluster="c1",environment="dev"}'
            value: 0.03
      - expr: round(saga:completion:ratio1h, 0.001)
        eval_time: 70m
        exp_samples:
          - labels: '{cluster="c1",environment="dev"}'
            value: 0.87
      - expr: round(saga:stock_rejection:ratio_rate15m, 0.001)
        eval_time: 30m
        exp_samples:
          - labels: '{cluster="c1",environment="dev"}'
            value: 0.103
      # 15분간 거절 150건 - 취소 60건
      - expr: saga:compensation_gap:increase15m
        eval_time: 40m
        exp_samples:
          - labels: '{__name__="saga:compensation_gap:increase15m",cluster="c1",environment="dev"}'
            value: 90
      - expr: count by (alertname) (ALERTS{alertstate="firing", alertname=~"Saga.*"})
        eval_time: 40m
        exp_samples:
          - labels: '{alertname="SagaCompensationGap"}'
            value: 1
          - labels: '{alertname="SagaPublishFailures"}'
            value: 1

  # ------------------------------------------------------------------
  # 주문 사가 정지: purchase 는 계속 발행되는데 service-product 처리 0건 (컨슈머 다운)
  # ------------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'nebula_commerce_funnel_events_total{cluster="c1",environment="dev",job="service-order",funnel_stage="order_placed",reason="none"}'
        values: '0+50x40'
      - series: 'nebula_commerce_funnel_events_total{cluster="c1",environment="dev",job="service-order",funnel_stage="purchase_published",reason="none"}'
        values: '0+50x40'
      - series: 'nebula_commerce_funnel_events_total{cluster="c1",environment="dev",job="service-product",funnel_stage="purchase_consumed",reason="none"}'
        values: '0+50x10 500x30'
    alert_rule_test:
      - alertname: SagaStalled
        eval_time: 15m
        exp_alerts: []
      - alertname: SagaStalled
        eval_time: 35m
        exp_alerts:
          - exp_labels:
              severity: critical
              team: service-owner
              cluster: c1
              environment: dev
            exp_annotations:
              summary: "주문 사가 정지: purchase 이벤트가 발행되지만 service-product 처리 0건"
              description: "purchase 토픽 lag(messaging:kafka_consumer_lag:sum), service-product 파드/컨슈머 에러 스팬(saga_topic:consumer_errors:rate5m) 확인."
              runbook_url: https://github.com/shashax42/Nebula-Monitoring/blob/main/docs/RUNBOOK.md#sagastalled

  # ------------------------------------------------------------------
  # 카나리 분석 (nebula-gitops platform/aws/base/analysis-slo-canary.yaml 과 같은 쿼리)
  #   service-order: canary 에러 5% vs stable 0.5% → 절대·상대 기준 모두 실패 (롤백)
  #   service-x    : canary/stable 모두 2% (외부 장애) → 상대 기준은 통과 (카나리 탓이 아님)
  # ------------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'traces_span_metrics_calls_total{cluster="c1",environment="dev",service_name="service-order",deployment_track="canary",span_kind="SPAN_KIND_SERVER",status_code="STATUS_CODE_OK"}'
        values: '0+95x30'
      - series: 'traces_span_metrics_calls_total{cluster="c1",environment="dev",service_name="service-order",deployment_track="canary",span_kind="SPAN_KIND_SERVER",status_code="STATUS_CODE_ERROR"}'
        values: '0+5x30'
      - series: 'traces_span_metrics_calls_total{cluster="c1",environment="dev",service_name="service-order",deployment_track="stable",span_kind="SPAN_KIND_SERVER",status_code="STATUS_CODE_OK"}'
        values: '0+995x30'
      - series: 'traces_span_metrics_calls_total{cluster="c1",environment="dev",service_name="service-order",deployment_track="stable",span_kind="SPAN_KIND_SERVER",status_code="STATUS_CODE_ERROR"}'
        values: '0+5x30'
      - series: 'traces_span_metrics_calls_total{cluster="c1",environment="dev",service_name="service-x",deployment_track="canary",span_kind="SPAN_KIND_SERVER",status_code="STATUS_CODE_OK"}'
        values: '0+98x30'
      - series: 'traces_span_metrics_calls_total{cluster="c1",environment="dev",service_name="service-x",deployment_track="canary",span_kind="SPAN_KIND_SERVER",status_code="STATUS_CODE_ERROR"}'
        values: '0+2x30'
      - series: 'traces_span_metrics_calls_total{cluster="c1",environment="dev",service_name="service-x",deployment_track="stable",span_kind="SPAN_KIND_SERVER",status_code="STATUS_CODE_OK"}'
        values: '0+980x30'
      - series: 'traces_span_metrics_calls_total{cluster="c1",environment="dev",service_name="service-x",deployment_track="stable",span_kind="SPAN_KIND_SERVER",status_code="STATUS_CODE_ERROR"}'
        values: '0+20x30'
      - series: 'traces_span_metrics_calls_total{cluster="c1",environment="dev",service_name="svc-clean",deployment_track="canary",span_kind="SPAN_KIND_SERVER",status_code="STATUS_CODE_UNSET"}'
        values: '0+100x30'
      - series: 'traces_span_metrics_calls_total{cluster="c1",environment="dev",service_name="svc-quiet",deployment_track="canary",span_kind="SPAN_KIND_SERVER",status_code="STATUS_CODE_UNSET"}'
        values: '0+10x30'
    promql_expr_test:
      # 관문 0) 표본 수: 2분간 canary 요청 (svc-clean 200건 → 통과, svc-quiet 20건 → 판정 불가, 없는 서비스 → 빈 결과 = 실패)
      - expr: sum(increase(traces_span_metrics_calls_total{service_name="svc-clean", deployment_track="canary", span_kind="SPAN_KIND_SERVER"}[2m]))
        eval_time: 20m
        exp_samples:
          - labels: '{}'
            value: 200
      - expr: sum(increase(traces_span_metrics_calls_total{service_name="svc-quiet", deployment_track="canary", span_kind="SPAN_KIND_SERVER"}[2m]))
        eval_time: 20m
        exp_samples:
          - labels: '{}'
            value: 20
      - expr: sum(increase(traces_span_metrics_calls_total{service_name="svc-missing", deployment_track="canary", span_kind="SPAN_KIND_SERVER"}[2m]))
        eval_time: 20m
        exp_samples: []
      # 에러 시리즈가 아예 없으면 'or vector(0)' 로 0 (예전 쿼리는 빈 결과 → "결과 없으면 통과" 에 기대고 있었다)
      - expr: (sum(rate(traces_span_metrics_calls_total{service_name="svc-clean", deployment_track="canary", span_kind="SPAN_KIND_SERVER", status_code="STATUS_CODE_ERROR"}[2m])) or vector(0)) / sum(rate(traces_span_metrics_calls_total{service_name="svc-clean", deployment_track="canary", span_kind="SPAN_KIND_SERVER"}[2m]))
        eval_time: 20m
        exp_samples:
          - labels: '{}'
            value: 0
      - expr: round((sum(rate(traces_span_metrics_calls_total{service_name="service-order", deployment_track="canary", span_kind="SPAN_KIND_SERVER", status_code="STATUS_CODE_ERROR"}[2m])) or vector(0)) / sum(rate(traces_span_metrics_calls_total{service_name="service-order", deployment_track="canary", span_kind="SPAN_KIND_SERVER"}[2m])), 0.001)
        eval_time: 20m
        exp_samples:
          - labels: '{}'
            value: 0.05
      - expr: ((sum(rate(traces_span_metrics_calls_total{service_name="service-order", deployment_track="canary", span_kind="SPAN_KIND_SERVER", status_code="STATUS_CODE_ERROR"}[2m])) or vector(0)) / sum(rate(traces_span_metrics_calls_total{service_name="service-order", deployment_track="canary", span_kind="SPAN_KIND_SERVER"}[2m]))) > bool 2 * ((sum(rate(traces_span_metrics_calls_total{service_name="service-order", deployment_track="stable", span_kind="SPAN_KIND_SERVER", status_code="STATUS_CODE_ERROR"}[2m])) or vector(0)) / sum(rate(traces_span_metrics_calls_total{service_name="service-order", deployment_track="stable", span_kind="SPAN_KIND_SERVER"}[2m]))) + 0.005
        eval_time: 20m
        exp_samples:
          - labels: '{}'
            value: 1
      - expr: ((sum(rate(traces_span_metrics_calls_total{service_name="service-x", deployment_track="canary", span_kind="SPAN_KIND_SERVER", status_code="STATUS_CODE_ERROR"}[2m])) or vector(0)) / sum(rate(traces_span_metrics_calls_total{service_name="service-x", deployment_track="canary", span_kind="SPAN_KIND_SERVER"}[2m]))) > bool 2 * ((sum(rate(traces_span_metrics_calls_total{service_name="service-x", deployment_track="stable", span_kind="SPAN_KIND_SERVER", status_code="STATUS_CODE_ERROR"}[2m])) or vector(0)) / sum(rate(traces_span_metrics_calls_total{service_name="service-x", deployment_track="stable", span_kind="SPAN_KIND_SERVER"}[2m]))) + 0.005
        eval_time: 20m
        exp_samples:
          - labels: '{}'
            value: 0

  # ------------------------------------------------------------------
  # 인프라 비용(₩/h): CPU 2코어×56 + 메모리 4GiB×7 = 140 ₩/h
  # ------------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'kube_pod_container_resource_requests{cluster="c1",namespace="shop",pod="p1",container="app",resource="cpu"}'
        values: '2x90'
      - series: 'kube_pod_container_resource_requests{cluster="c1",namespace="shop",pod="p1",container="app",resource="memory"}'
        values: '4294967296x90'
      - series: 'kube_pod_status_phase{cluster="c1",namespace="shop",pod="p1",phase="Running"}'
        values: '1x90'
    promql_expr_test:
      - expr: cluster:infra_cost_krw:rate1h
        eval_time: 70m
        exp_samples:
          - labels: '{__name__="cluster:infra_cost_krw:rate1h",cluster="c1"}'
            value: 140

  # ------------------------------------------------------------------
  # 배치: 실행 때만 샘플이 생기는 게이지 (5분 간격, 사이는 빈 칸)
  #   cancel 잡: 성공 계속, 마지막 실행에서 오래된 PENDING 주문 3건 취소 → StaleOrdersAutoCanceled
  #   delete 잡: 20분까지 성공, 이후 실패만 → BatchJobFailing, 50분에 성공 기록이 30분을 넘김 → BatchJobStale
  # ------------------------------------------------------------------
  - interval: 5m
    input_series:
      - series: 'nebula_batch_job_last_run_seconds{cluster="c1",environment="dev",job="batch-order",cronjob="batch-order-every-5-minutes",job_name="cancelOrderWhereStateIsPendingJob",status="completed"}'
        values: '0+300x12'
      - series: 'nebula_batch_order_rows{cluster="c1",environment="dev",job="batch-order",cronjob="batch-order-every-5-minutes",job_name="cancelOrderWhereStateIsPendingJob"}'
        values: '0x10 3 3'
      - series: 'nebula_batch_job_last_run_seconds{cluster="c1",environment="dev",job="batch-order",cronjob="batch-order-every-2-minutes",job_name="deleteOrderWhereStateIsCanceledJob",status="completed"}'
        values: '0+300x4'
      - series: 'nebula_batch_job_last_run_seconds{cluster="c1",environment="dev",job="batch-order",cronjob="batch-order-every-2-minutes",job_name="deleteOrderWhereStateIsCanceledJob",status="failed"}'
        values: '_x5 1500+300x7'
    promql_expr_test:
      - expr: batch_job:since_last_success:seconds
        eval_time: 55m
        exp_samples:
          - labels: '{__name__="batch_job:since_last_success:seconds",cluster="c1",environment="dev",job_name="cancelOrderWhereStateIsPendingJob"}'
            value: 0
          - labels: '{__name__="batch_job:since_last_success:seconds",cluster="c1",environment="dev",job_name="deleteOrderWhereStateIsCanceledJob"}'
            value: 2100
      - expr: count by (alertname, job_name) (ALERTS{alertstate="firing", alertname=~"Batch.*|StaleOrders.*"})
        eval_time: 60m
        exp_samples:
          - labels: '{alertname="BatchJobFailing",job_name="deleteOrderWhereStateIsCanceledJob"}'
            value: 1
          - labels: '{alertname="BatchJobStale",job_name="deleteOrderWhereStateIsCanceledJob"}'
            value: 1
          - labels: '{alertname="StaleOrdersAutoCanceled",job_name="cancelOrderWhereStateIsPendingJob"}'
            value: 1

  # ------------------------------------------------------------------
  # 이상 감지: 지난주 같은 시간 대비 (5분 간격 8일)
  #   shop: 1주 내내 10 req/s, 마지막 1시간만 40 → 지난주 대비 4배 → TrafficAnomaly
  #   steady: 매일 같은 패턴(낮 30, 밤 5) → 하루 안에서 6배 차이가 나도 지난주와 같아서 1배 (패턴이 바뀌는 경계 1시간은 비율이 흔들려 3배 기준을 둠)
  # 유휴 점수: 7일 p95 기준
  #   idle-ns: 항상 requests 의 10% → 점수 0.9 → IdleResourceHigh
  #   peaky-ns: 평소 5%, 하루 10% 시간대만 90% → 평균으론 유휴(구 규칙 0.83)지만 p95 로는 피크를 써서 0.5 → 울리지 않음
  # ------------------------------------------------------------------
  - interval: 5m
    input_series:
      - series: 'service:requests:rate5m{cluster="c1",environment="dev",service_name="shop"}'
        values: '10x2364 40x13'
