    promql_expr_test:
      - expr: round(service:requests:ratio_vs_last_week, 0.01)
        eval_time: 11880m
        exp_samples:
          - labels: '{cluster="c1",environment="dev",service_name="shop"}'
            value: 4
          - labels: '{cluster="c1",environment="dev",service_name="steady"}'
            value: 1
      - expr: round(namespace:idle_resource_score:ratio7d, 0.01)
        eval_time: 11880m
        exp_samples:
          - labels: '{cluster="c1",namespace="idle-ns"}'
            value: 0.9
          - labels: '{cluster="c1",namespace="peaky-ns"}'
            value: 0.5
    alert_rule_test:
      - alertname: TrafficAnomaly
        eval_time: 11880m
        exp_alerts:
          - exp_labels:
              severity: info
              team: service-owner
              cluster: c1
              environment: dev
              service_name: shop
            exp_annotations:
              summary: "shop 트래픽이 지난주 같은 시간의 4배"
              description: "급증(외부 유입/봇/프로모션) 또는 급감(상위 장애/라우팅 문제) 가능성."
              runbook_url: https://github.com/shashax42/Nebula-Monitoring/blob/main/docs/RUNBOOK.md#trafficanomaly

  # ------------------------------------------------------------------
  # 파이프라인: 노드 3대인데 agent 2개만 동작 → TelemetryAgentMissing
  # ------------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'kube_node_info{cluster="c1",node="n1"}'
        values: '1x30'
      - series: 'kube_node_info{cluster="c1",node="n2"}'
        values: '1x30'
      - series: 'kube_node_info{cluster="c1",node="n3"}'
        values: '1x30'
      - series: 'up{cluster="c1",job="otelcol",component="agent",instance="a1"}'
        values: '1x30'
      - series: 'up{cluster="c1",job="otelcol",component="agent",instance="a2"}'
        values: '1x30'
      - series: 'up{cluster="c1",job="otelcol",component="gateway",instance="g1"}'
        values: '1x30'
    alert_rule_test:
      - alertname: TelemetryAgentMissing
        eval_time: 20m
        exp_alerts:
          - exp_labels:
              severity: warning
              team: platform
              cluster: c1
            exp_annotations:
              summary: "c1: 노드 수보다 동작 중인 OTel agent 가 적음"
              description: "해당 노드의 로그/kubelet 메트릭이 유실 중. DaemonSet 스케줄링(taint, 리소스) 확인."
              runbook_url: https://github.com/shashax42/Nebula-Monitoring/blob/main/docs/RUNBOOK.md#telemetryagentmissing
      - alertname: TelemetryGatewayAbsent
        eval_time: 20m
        exp_alerts: []

