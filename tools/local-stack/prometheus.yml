# AMP 대신 로컬 Prometheus 가 gateway 의 prometheus exporter 를 scrape 하고 같은 규칙을 평가한다.
# render.py 가 rule_files 를 정해 generated/prometheus.yml 로 쓴다 (--extensions 면 확장 규칙 포함).
global:
  scrape_interval: 15s
  evaluation_interval: 30s
rule_files:
  - /etc/prometheus/rules/*.rules.yaml
scrape_configs:
  - job_name: otelcol
    honor_labels: true
    static_configs:
      - targets: ["gateway:9464"]
        labels:
          component: gateway
    metric_relabel_configs:
      # PRW 의 external_labels(cluster/environment) 를 로컬에서 재현
      - target_label: cluster
        replacement: local
      - target_label: environment
        replacement: dev
