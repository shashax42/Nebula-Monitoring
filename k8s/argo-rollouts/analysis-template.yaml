# Reliability & GitOps: 배포 직후 이상 징후를 지표로 판정해 자동 롤백
#   - canary 의 에러율/P99 를 같은 시점 stable 과 비교(상대) + SLO 절대 기준 동시 적용
#   - 지표는 gateway span_metrics → AMP 의 traces_span_metrics_* (앱 코드 변경 불필요)
#   - "확률 기반": 단발성 튐에 롤백하지 않도록 count/failureLimit 로 연속 실패 횟수를 본다
#     (5회 측정 중 2회 실패 시 롤백 ≈ 단일 측정 오탐률 p 일 때 오롤백 확률 ~10p²)
#
# 전제: canary 파드는 OTEL_SERVICE_NAME=<서비스>-canary 로 띄운다 (Rollout 의 canaryMetadata/ephemeral env).
#       span_metrics 에는 버전 차원이 없으므로 service.name 으로 canary 와 stable 을 구분한다.
apiVersion: argoproj.io/v1alpha1
kind: ClusterAnalysisTemplate
metadata:
  name: nebula-slo-canary
spec:
  args:
    - name: service            # stable service.name (예: payment-service)
    - name: canary-service     # canary service.name (예: payment-service-canary)
    - name: amp-endpoint       # terraform output -raw amp_endpoint  (…/workspaces/ws-xxxx/)
    - name: region
      value: ap-northeast-2
    - name: max-error-ratio
      value: "0.01"            # 절대 기준: canary 에러율 1% 미만
    - name: max-p99-seconds
      value: "1.5"
  metrics:
    - name: canary-error-ratio
      interval: 1m
      count: 5
      failureLimit: 1
      successCondition: len(result) == 0 || isNaN(result[0]) || result[0] < {{args.max-error-ratio}}
      provider:
        prometheus:
          address: "{{args.amp-endpoint}}"
          authentication:
            sigv4:
              region: "{{args.region}}"
          query: |
            sum(rate(traces_span_metrics_calls_total{service_name="{{args.canary-service}}", span_kind="SPAN_KIND_SERVER", status_code="STATUS_CODE_ERROR"}[2m]))
            /
            sum(rate(traces_span_metrics_calls_total{service_name="{{args.canary-service}}", span_kind="SPAN_KIND_SERVER"}[2m]))

    # canary 에러율이 stable 보다 2배 이상 + 0.5%p 이상 나쁘면 실패 (상대 비교: 외부 장애로 둘 다 나쁜 경우 롤백하지 않음)
    - name: canary-vs-stable-errors
      interval: 1m
      count: 5
      failureLimit: 1
      successCondition: len(result) == 0 || isNaN(result[0]) || result[0] < 1
      provider:
        prometheus:
          address: "{{args.amp-endpoint}}"
          authentication:
            sigv4:
              region: "{{args.region}}"
          query: |
            (
              (sum(rate(traces_span_metrics_calls_total{service_name="{{args.canary-service}}", span_kind="SPAN_KIND_SERVER", status_code="STATUS_CODE_ERROR"}[2m])) or vector(0))
              / sum(rate(traces_span_metrics_calls_total{service_name="{{args.canary-service}}", span_kind="SPAN_KIND_SERVER"}[2m]))
            )
            >
            2 * (
              (sum(rate(traces_span_metrics_calls_total{service_name="{{args.service}}", span_kind="SPAN_KIND_SERVER", status_code="STATUS_CODE_ERROR"}[2m])) or vector(0))
              / sum(rate(traces_span_metrics_calls_total{service_name="{{args.service}}", span_kind="SPAN_KIND_SERVER"}[2m]))
            ) + 0.005

    - name: canary-p99
      interval: 1m
      count: 5
      failureLimit: 1
      successCondition: len(result) == 0 || isNaN(result[0]) || result[0] < {{args.max-p99-seconds}}
      provider:
        prometheus:
          address: "{{args.amp-endpoint}}"
          authentication:
            sigv4:
              region: "{{args.region}}"
          query: |
            histogram_quantile(0.99, sum by (le) (rate(traces_span_metrics_duration_seconds_bucket{service_name="{{args.canary-service}}", span_kind="SPAN_KIND_SERVER"}[2m])))
---
# 예시 Rollout 단계 (payment-service)
#   strategy:
#     canary:
#       steps:
#         - setWeight: 10
#         - analysis:
#             templates: [{templateName: nebula-slo-canary, clusterScope: true}]
#             args:
#               - {name: service, value: payment-service}
#               - {name: canary-service, value: payment-service-canary}
#               - {name: amp-endpoint, value: "https://aps-workspaces.ap-northeast-2.amazonaws.com/workspaces/ws-xxxx/"}
#         - setWeight: 50
#         - pause: {duration: 5m}
